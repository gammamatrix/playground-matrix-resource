description: 'The Matrix tag model.'
type: object
properties:
  id:
    description: 'The primary key.'
    type: string
    format: uuid
    readOnly: true
  tag_type:
    description: 'The tag type of this tag.'
    type: string
    nullable: true
  created_by_id:
    description: 'Foreign key: links a created by user to this tag.'
    type: string
    format: uuid
    nullable: true
