parameters:
  -
    in: path
    name: id
    required: true
    description: 'The ticket id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Ticket
  summary: 'Edit a ticket form.'
  operationId: edit_ticket
  responses:
    200:
      description: 'The edit ticket information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/ticket.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/tickets/{id}">Edit a ticket</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
