get:
  tags:
    - Ticket
  summary: 'Create a ticket form.'
  operationId: create_ticket
  responses:
    200:
      description: 'The create ticket information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/ticket.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/tickets">Create a ticket</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
