post:
  tags:
    - Ticket
  summary: 'Get tickets from the index using POST.'
  operationId: post_tickets_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/ticket/form.yml
  responses:
    200:
      description: 'Get the tickets from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/ticket.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
