parameters:
  -
    in: path
    name: id
    required: true
    description: 'The release id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Release
  summary: 'Edit a release form.'
  operationId: edit_release
  responses:
    200:
      description: 'The edit release information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/release.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/releases/{id}">Edit a release</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
