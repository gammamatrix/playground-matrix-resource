get:
  tags:
    - Release
  summary: 'Get releases from the index.'
  operationId: get_releases_index
  responses:
    200:
      description: 'Get the releases from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/release.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
post:
  tags:
    - Release
  summary: 'Create a release.'
  operationId: post_release
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/release/post.yml
  responses:
    200:
      description: 'The created release.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/release.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The release is locked. Unlock to patch.'
