get:
  tags:
    - Release
  summary: 'Create a release form.'
  operationId: create_release
  responses:
    200:
      description: 'The create release information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/release.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/releases">Create a release</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
