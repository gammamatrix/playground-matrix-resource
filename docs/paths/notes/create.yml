get:
  tags:
    - Note
  summary: 'Create a note form.'
  operationId: create_note
  responses:
    200:
      description: 'The create note information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/note.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/notes">Create a note</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
