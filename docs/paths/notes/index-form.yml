post:
  tags:
    - Note
  summary: 'Get notes from the index using POST.'
  operationId: post_notes_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/note/form.yml
  responses:
    200:
      description: 'Get the notes from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/note.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
