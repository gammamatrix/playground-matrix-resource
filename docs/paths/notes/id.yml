parameters:
  -
    in: path
    name: id
    required: true
    description: 'The note id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Note
  summary: 'Get a note by id.'
  operationId: get_note
  responses:
    200:
      description: 'The note data.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/note.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
delete:
  tags:
    - Note
  summary: 'Delete a note by id.'
  operationId: delete_note
  responses:
    204:
      description: 'The note has been deleted.'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    423:
      description: 'The note is locked. Unlock to delete.'
patch:
  tags:
    - Note
  summary: 'Patch a note by id.'
  operationId: patch_note
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/note/patch.yml
  responses:
    200:
      description: 'The note has been patched.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/note.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The note is locked. Unlock to patch.'
