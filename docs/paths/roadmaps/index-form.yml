post:
  tags:
    - Roadmap
  summary: 'Get roadmaps from the index using POST.'
  operationId: post_roadmaps_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/roadmap/form.yml
  responses:
    200:
      description: 'Get the roadmaps from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/roadmap.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
