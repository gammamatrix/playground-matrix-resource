get:
  tags:
    - Roadmap
  summary: 'Get roadmaps from the index.'
  operationId: get_roadmaps_index
  responses:
    200:
      description: 'Get the roadmaps from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/roadmap.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
post:
  tags:
    - Roadmap
  summary: 'Create a roadmap.'
  operationId: post_roadmap
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/roadmap/post.yml
  responses:
    200:
      description: 'The created roadmap.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/roadmap.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The roadmap is locked. Unlock to patch.'
