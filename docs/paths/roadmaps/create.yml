get:
  tags:
    - Roadmap
  summary: 'Create a roadmap form.'
  operationId: create_roadmap
  responses:
    200:
      description: 'The create roadmap information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/roadmap.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/roadmaps">Create a roadmap</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
