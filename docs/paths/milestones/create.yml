get:
  tags:
    - Milestone
  summary: 'Create a milestone form.'
  operationId: create_milestone
  responses:
    200:
      description: 'The create milestone information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/milestone.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/milestones">Create a milestone</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
