parameters:
  -
    in: path
    name: id
    required: true
    description: 'The milestone id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Milestone
  summary: 'Edit a milestone form.'
  operationId: edit_milestone
  responses:
    200:
      description: 'The edit milestone information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/milestone.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/milestones/{id}">Edit a milestone</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
