parameters:
  -
    in: path
    name: id
    required: true
    description: 'The flow id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Flow
  summary: 'Edit a flow form.'
  operationId: edit_flow
  responses:
    200:
      description: 'The edit flow information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/flow.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/flows/{id}">Edit a flow</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
