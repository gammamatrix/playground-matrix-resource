get:
  tags:
    - Flow
  summary: 'Create a flow form.'
  operationId: create_flow
  responses:
    200:
      description: 'The create flow information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/flow.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/flows">Create a flow</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
