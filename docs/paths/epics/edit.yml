parameters:
  -
    in: path
    name: id
    required: true
    description: 'The epic id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Epic
  summary: 'Edit a epic form.'
  operationId: edit_epic
  responses:
    200:
      description: 'The edit epic information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/epic.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/epics/{id}">Edit a epic</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
