get:
  tags:
    - Epic
  summary: 'Create a epic form.'
  operationId: create_epic
  responses:
    200:
      description: 'The create epic information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/epic.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/epics">Create a epic</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
