    - Sprint
  summary: 'Get sprints from the index using POST.'
  operationId: post_sprints_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/sprint/form.yml
  responses:
    200:
      description: 'Get the sprints from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
