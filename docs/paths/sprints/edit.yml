parameters:
  -
    in: path
    name: id
    required: true
    description: 'The sprint id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Sprint
  summary: 'Edit a sprint form.'
  operationId: edit_sprint
  responses:
    200:
      description: 'The edit sprint information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/sprint.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/sprints/{id}">Edit a sprint</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
