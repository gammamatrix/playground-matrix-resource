get:
  tags:
    - Sprint
  summary: 'Get sprints from the index.'
  operationId: get_sprints_index
  responses:
    200:
      description: 'Get the sprints from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/sprint.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
post:
  tags:
    - Sprint
  summary: 'Create a sprint.'
  operationId: post_sprint
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/sprint/post.yml
  responses:
    200:
      description: 'The created sprint.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/sprint.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The sprint is locked. Unlock to patch.'
