get:
  tags:
    - Sprint
  summary: 'Create a sprint form.'
  operationId: create_sprint
  responses:
    200:
      description: 'The create sprint information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/sprint.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/sprints">Create a sprint</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
