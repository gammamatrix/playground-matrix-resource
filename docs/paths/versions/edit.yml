parameters:
  -
    in: path
    name: id
    required: true
    description: 'The version id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Version
  summary: 'Edit a version form.'
  operationId: edit_version
  responses:
    200:
      description: 'The edit version information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/version.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/versions/{id}">Edit a version</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
