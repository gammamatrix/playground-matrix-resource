get:
  tags:
    - Version
  summary: 'Create a version form.'
  operationId: create_version
  responses:
    200:
      description: 'The create version information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/version.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/versions">Create a version</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
