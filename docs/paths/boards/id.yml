parameters:
  -
    in: path
    name: id
    required: true
    description: 'The board id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Board
  summary: 'Get a board by id.'
  operationId: get_board
  responses:
    200:
      description: 'The board data.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/board.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
delete:
  tags:
    - Board
  summary: 'Delete a board by id.'
  operationId: delete_board
  responses:
    204:
      description: 'The board has been deleted.'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    423:
      description: 'The board is locked. Unlock to delete.'
patch:
  tags:
    - Board
  summary: 'Patch a board by id.'
  operationId: patch_board
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/board/patch.yml
  responses:
    200:
      description: 'The board has been patched.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/board.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The board is locked. Unlock to patch.'
