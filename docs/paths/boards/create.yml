get:
  tags:
    - Board
  summary: 'Create a board form.'
  operationId: create_board
  responses:
    200:
      description: 'The create board information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/board.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/boards">Create a board</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
