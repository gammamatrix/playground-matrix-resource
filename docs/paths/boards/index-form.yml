post:
  tags:
    - Board
  summary: 'Get boards from the index using POST.'
  operationId: post_boards_index
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/board/form.yml
  responses:
    200:
      description: 'Get the boards from the index.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: ../../models/board.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
