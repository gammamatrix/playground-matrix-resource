parameters:
  -
    in: path
    name: id
    required: true
    description: 'The board id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Board
  summary: 'Edit a board form.'
  operationId: edit_board
  responses:
    200:
      description: 'The edit board information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/board.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/boards/{id}">Edit a board</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
