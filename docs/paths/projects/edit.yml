parameters:
  -
    in: path
    name: id
    required: true
    description: 'The project id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Project
  summary: 'Edit a project form.'
  operationId: edit_project
  responses:
    200:
      description: 'The edit project information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/project.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/projects/{id}">Edit a project</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
