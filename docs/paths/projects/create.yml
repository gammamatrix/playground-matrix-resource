get:
  tags:
    - Project
  summary: 'Create a project form.'
  operationId: create_project
  responses:
    200:
      description: 'The create project information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/project.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/projects">Create a project</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
