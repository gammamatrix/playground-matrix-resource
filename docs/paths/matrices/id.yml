parameters:
  -
    in: path
    name: id
    required: true
    description: 'The matrix id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Matrix
  summary: 'Get a matrix by id.'
  operationId: get_matrix
  responses:
    200:
      description: 'The matrix data.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/matrix.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
delete:
  tags:
    - Matrix
  summary: 'Delete a matrix by id.'
  operationId: delete_matrix
  responses:
    204:
      description: 'The matrix has been deleted.'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    423:
      description: 'The matrix is locked. Unlock to delete.'
patch:
  tags:
    - Matrix
  summary: 'Patch a matrix by id.'
  operationId: patch_matrix
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../../requests/matrix/patch.yml
  responses:
    200:
      description: 'The matrix has been patched.'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/matrix.yml
              meta:
                type: object
    401:
      description: Unauthorized
    403:
      description: Forbidden
    422:
      description: 'Validation error'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: object
                properties:
                  title:
                    type: array
                    items:
                      type: string
                      example: 'The title field is required.'
    423:
      description: 'The matrix is locked. Unlock to patch.'
