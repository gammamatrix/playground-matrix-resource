parameters:
  -
    in: path
    name: id
    required: true
    description: 'The matrix id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Matrix
  summary: 'Edit a matrix form.'
  operationId: edit_matrix
  responses:
    200:
      description: 'The edit matrix information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/matrix.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/matrices/{id}">Edit a matrix</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
