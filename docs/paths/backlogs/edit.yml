parameters:
  -
    in: path
    name: id
    required: true
    description: 'The backlog id.'
    schema:
      type: string
      format: uuid
get:
  tags:
    - Backlog
  summary: 'Edit a backlog form.'
  operationId: edit_backlog
  responses:
    200:
      description: 'The edit backlog information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/backlog.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/backlogs/{id}">Edit a backlog</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
