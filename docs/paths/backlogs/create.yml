get:
  tags:
    - Backlog
  summary: 'Create a backlog form.'
  operationId: create_backlog
  responses:
    200:
      description: 'The create backlog information (JSON) or (HTML).'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: ../../models/backlog.yml
              meta:
                type: object
        text/html:
          schema:
            type: string
            example: '<html><body><form method="POST" action="/resource/matrix/backlogs">Create a backlog</form></body></html>'
    401:
      description: Unauthorized
    403:
      description: Forbidden
